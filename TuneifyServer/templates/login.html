<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tuneify Admin - Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a0533 0%, #0f0121 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 20px;
            padding: 40px;
            width: 360px;
            text-align: center;
        }
        h1 { color:#FFFFFF; font-size:28px; margin-bottom:6px; }
        .sub { color:#AAAACC; font-size:14px; margin-bottom:28px; }
        input {
            width:100%; padding:12px 16px; margin-bottom:14px;
            border-radius:10px; border:1px solid rgba(255,255,255,0.15);
            background:rgba(255,255,255,0.07); color:#FFFFFF;
            font-size:15px; outline:none;
        }
        input::placeholder { color:#7777AA; }
        button {
            width:100%; padding:13px; border-radius:10px; border:none;
            background:#7C3AED; color:#FFFFFF; font-size:16px;
            font-weight:600; cursor:pointer; margin-top:4px;
        }
        button:hover { background:#6D28D9; }
        .error {
            background:rgba(220,50,50,0.15);
            border:1px solid rgba(220,50,50,0.3);
            color:#FF8888; padding:10px 14px;
            border-radius:8px; font-size:13px; margin-bottom:16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Tuneify 🎵</h1>
        <p class="sub">Admin Panel - Login to continue</p>
        {% if error %}<div class="error">{{ error }}</div>{% endif %}
        <form method="POST">
            <input type="text"     name="username" placeholder="Username" required autofocus>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
    </div>
</body>
</html>
